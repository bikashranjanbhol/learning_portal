name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push to the same branch cancels the in-flight run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      # Placeholders. The build must not need real credentials — env access in
      # lib/env.ts is lazy precisely so CI can build without secrets. If this
      # job starts failing on a missing variable, something began reading env
      # at module scope, which would also break `next build` on a fresh clone.
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
      NEXT_PUBLIC_SITE_URL: https://example.com
      NEXT_TELEMETRY_DISABLED: '1'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Build
        run: npm run build

      # CLAUDE.md treats SEO regressions as bugs of the same severity as a
      # broken checkout. Every failure this catches is silent in a browser, so
      # CI is the only place it can realistically be caught.
      - name: Start server
        run: npm run start &

      - name: Wait for server
        run: npx --yes wait-on http://127.0.0.1:3000 --timeout 60000

      - name: Verify SEO and paywall markup
        run: npm run verify:seo
        env:
          BASE_URL: http://127.0.0.1:3000

      # Guard for CLAUDE.md #2 — the one constraint that fails silently.
      # The self-test runs first so a broken guard fails loudly instead of
      # passing everything.
      - name: Guard self-test
        run: bash scripts/check-static-routes.sh --self-test

      - name: Guard — static route groups stay static
        run: bash scripts/check-static-routes.sh

  # Requires a Supabase development project. Add the three secrets in
  # Settings -> Secrets -> Actions to enable, then delete the `if: false`.
  rls:
    name: Verify RLS policies
    runs-on: ubuntu-latest
    if: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run verify:rls
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
